<div class="panel">
  <aside class="lateral" id="lateral">
    <div class="lateral-marca">
      <img src="/assets/logo/emblema-256.webp" alt="" width="34" height="34">
      <span><b>EXCLUSIVE CAPS</b><small>Panel</small></span>
    </div>

    <nav class="nav" id="nav" aria-label="Secciones del panel"></nav>

    <div class="lateral-pie">
      <div class="quien"><b id="quien-nombre">—</b><span id="quien-rol"></span></div>
      <button type="button" class="btn btn--suave btn--ancho" id="btn-salir" style="color:#C7D0E0">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-salir"></use></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="principal">
    <header class="barra">
      <button type="button" class="btn btn--linea btn-menu" id="btn-menu" aria-label="Abrir el menú" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"></use></svg>
      </button>
      <div>
        <div class="migas" id="migas">Panel</div>
        <h1 id="titulo">Tablero</h1>
      </div>
      <div class="acciones" id="acciones"></div>
    </header>

    <main class="contenido" id="contenido">
      <div class="cargando">Cargando…</div>
    </main>
  </div>
</div>

<div class="mensajes" id="mensajes" role="status" aria-live="polite"></div>

<script src="/admin/panel.js" defer></script>
